<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tic Tac Toe with PyScript</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
        <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    </head>

    <body>
        <div class="container">
            <h1>Triple Scoop</h1>

            <div class="game-layout">
                <div class="left">
                    <div id="scoreboard">
                        <div class="score">
                            🍓 <span id="x-score">0</span>
                        </div>

                        <div class="score">
                            🍫 <span id="o-score">0</span>
                        </div>

                        <div id="status"></div>
        
                        <div id="board"></div>

                        <button id="restart">
                            ♡ New Round ♡
                        </button>
                    </div>

                    <div id="board"></div>
                </div>
            </div>
        </div>
        
        <script type="py" src="./game.py"></script> 
    </body>
</html>
